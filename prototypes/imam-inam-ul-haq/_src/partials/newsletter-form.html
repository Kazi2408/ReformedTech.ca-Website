<form class="nl-form" data-newsletter novalidate>
  <label for="n-email" class="nl-label" data-i18n="nl.label">Email address</label>
  <div class="nl-row">
    <input id="n-email" name="email" type="email" dir="ltr" inputmode="email" autocomplete="email" placeholder="name@example.com" aria-describedby="n-email-err n-email-note">
    <button type="submit" class="btn nl-submit" data-i18n="nl.submit">Subscribe</button>
  </div>
  <p class="f-err" id="n-email-err"></p>
  <p class="nl-note" id="n-email-note" data-i18n="nl.privacy">Demo only — no email address is collected.</p>
  <p class="form-status" data-nl-status role="status" tabindex="-1" hidden></p>
</form>
